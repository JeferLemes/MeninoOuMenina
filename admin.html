<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área dos pais</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E7;
    --card:#FFFCF6;
    --ink:#3B2A35;
    --ink-soft:#6B5763;
    --rose:#F0A38A;
    --rose-deep:#D97C55;
    --blue:#A8D5BA;
    --blue-deep:#5C9873;
    --border:rgba(59,42,53,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:'Fraunces',serif; font-weight:600; margin:0;}
  .wrap{max-width:560px; margin:0 auto; padding:56px 20px 80px;}

  .gate{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px 26px;
    text-align:center;
  }
  .gate h1{font-size:1.6rem; margin-bottom:8px;}
  .gate p{color:var(--ink-soft); font-size:.95rem; margin-bottom:22px;}
  .gate input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    font-size:1rem;
    text-align:center;
    margin-bottom:14px;
  }
  .gate button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:100px;
    background:var(--ink);
    color:var(--cream);
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
  }
  .gate button:hover{background:var(--rose-deep);}
  .gate .err{color:#a33; font-size:.88rem; margin-top:10px; min-height:1.2em;}

  header.top{text-align:center; margin-bottom:28px;}
  header.top h1{font-size:1.7rem;}
  header.top p{color:var(--ink-soft); font-size:.92rem; margin-top:6px;}

  .summary{
    display:flex;
    gap:14px;
    margin-bottom:20px;
  }
  .summary .box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    text-align:center;
  }
  .summary .box .n{font-family:'Fraunces',serif; font-size:1.6rem; font-weight:600;}
  .summary .box.menina .n{color:var(--rose-deep);}
  .summary .box.menino .n{color:var(--blue-deep);}
  .summary .box .label{font-size:.82rem; color:var(--ink-soft);}

  .top-actions{
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
  }
  .btn-clear-all{
    background:transparent;
    border:1px solid rgba(163,51,51,0.3);
    color:#a33;
    padding:6px 14px;
    border-radius:100px;
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    transition:all 0.2s;
  }
  .btn-clear-all:hover{
    background:#a33;
    color:#fff;
  }

  .list{display:flex; flex-direction:column; gap:12px;}
  .entry{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
  }
  .entry .row1{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .entry .name{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem;}
  .entry .relation{font-size:.78rem; color:var(--ink-soft);}
  .tag{
    display:inline-block;
    margin-top:8px;
    padding:3px 11px;
    border-radius:100px;
    font-size:.78rem;
    font-weight:700;
  }
  .tag.menina{background:rgba(240,163,138,.25); color:var(--rose-deep);}
  .tag.menino{background:rgba(168,213,186,.35); color:var(--blue-deep);}
  .entry .message{margin-top:10px; font-size:.92rem; color:var(--ink); font-style:italic;}
  .entry .no-message{margin-top:10px; font-size:.85rem; color:var(--ink-soft);}
  
  .entry .bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    padding-top:8px;
    border-top:1px dashed rgba(59,42,53,.08);
  }
  .entry .time{font-size:.75rem; color:var(--ink-soft);}
  .btn-delete{
    background:transparent;
    border:none;
    color:var(--ink-soft);
    font-size:.78rem;
    cursor:pointer;
    padding:2px 6px;
    border-radius:6px;
    transition:color 0.2s;
  }
  .btn-delete:hover{
    color:#a33;
    text-decoration:underline;
  }

  .empty{text-align:center; color:var(--ink-soft); padding:30px 0;}
  .loading{text-align:center; color:var(--ink-soft); padding:30px 0;}
</style>
</head>
<body>

<div class="wrap">
  <div id="gateView" class="gate">
    <h1>Área dos pais</h1>
    <p>Digite a senha para ver todos os palpites e recados dos convidados.</p>
    <input type="password" id="pwInput" placeholder="Senha">
    <button id="pwBtn">Entrar</button>
    <div class="err" id="pwErr"></div>
  </div>

  <div id="contentView" style="display:none;">
    <header class="top">
      <h1>Palpites e recados</h1>
      <p>Só vocês dois têm acesso a esta página.</p>
    </header>
    <div class="summary">
      <div class="box menina">
        <div class="n" id="countMenina">0</div>
        <div class="label">Serena</div>
      </div>
      <div class="box menino">
        <div class="n" id="countMenino">0</div>
        <div class="label">Leonardo</div>
      </div>
    </div>

    <div class="top-actions">
      <button class="btn-clear-all" onclick="clearAllGuesses()">🔥 Limpar todos os testes</button>
    </div>

    <div class="list" id="list">
      <div class="loading">Carregando...</div>
    </div>
  </div>
</div>

<script>
  const gateView = document.getElementById('gateView');
  const contentView = document.getElementById('contentView');
  const pwInput = document.getElementById('pwInput');
  const pwBtn = document.getElementById('pwBtn');
  const pwErr = document.getElementById('pwErr');

  function fmtDate(ts){
    return new Date(ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function renderList(guesses){
    document.getElementById('countMenina').textContent = guesses.filter(g => g.guess === 'menina').length;
    document.getElementById('countMenino').textContent = guesses.filter(g => g.guess === 'menino').length;

    const list = document.getElementById('list');
    if (guesses.length === 0){
      list.innerHTML = '<div class="empty">Nenhum palpite ainda.</div>';
      return;
    }
    const safe = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    list.innerHTML = guesses.map(g => `
      <div class="entry">
        <div class="row1">
          <span class="name">${safe(g.name)}</span>
          <span class="relation">${safe(g.relation)}</span>
        </div>
        <span class="tag ${g.guess}">${g.guess === 'menina' ? 'Serena' : 'Leonardo'}</span>
        ${g.message ? `<div class="message">“${safe(g.message)}”</div>` : '<div class="no-message">Sem recado</div>'}
        <div class="bottom-row">
          <span class="time">${fmtDate(g.ts)}</span>
          <button class="btn-delete" onclick="deleteGuess(${g.ts})">🗑️ Excluir</button>
        </div>
      </div>
    `).join('');
  }

  async function tryLoad(password){
    const res = await fetch('/api/guesses-admin', { headers: { 'x-admin-key': password } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Erro ${res.status}`);
    }
    return res.json();
  }

  async function deleteGuess(ts){
    if (!confirm('Deseja realmente apagar este palpite?')) return;
    const password = sessionStorage.getItem('revelacao_admin_key');
    try {
      const res = await fetch('/api/guesses-admin', {
        method: 'DELETE',
        headers: {
          'x-admin-key': password,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ ts })
      });
      if (!res.ok) throw new Error('Erro ao apagar');
      const guesses = await tryLoad(password);
      renderList(guesses);
    } catch(err) {
      alert('Não foi possível apagar o palpite.');
    }
  }

  async function clearAllGuesses(){
    if (!confirm('ATENÇÃO: Tem certeza que deseja apagar TODOS os palpites da lista?')) return;
    const password = sessionStorage.getItem('revelacao_admin_key');
    try {
      const res = await fetch('/api/guesses-admin', {
        method: 'DELETE',
        headers: {
          'x-admin-key': password,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ clearAll: true })
      });
      if (!res.ok) throw new Error('Erro ao apagar todos');
      renderList([]);
    } catch(err) {
      alert('Não foi possível apagar a lista.');
    }
  }

  async function attemptLogin(password){
    pwErr.textContent = '';
    pwBtn.disabled = true;
    pwBtn.textContent = 'Entrando...';
    try{
      const guesses = await tryLoad(password);
      sessionStorage.setItem('revelacao_admin_key', password);
      gateView.style.display = 'none';
      contentView.style.display = 'block';
      renderList(guesses);
    }catch(err){
      pwErr.textContent = err.message === 'Senha incorreta.' ? 'Senha incorreta.' : `Não foi possível entrar (${err.message}).`;
    }finally{
      pwBtn.disabled = false;
      pwBtn.textContent = 'Entrar';
    }
  }

  pwBtn.addEventListener('click', () => {
    if (pwInput.value.trim()) attemptLogin(pwInput.value.trim());
  });
  pwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && pwInput.value.trim()) attemptLogin(pwInput.value.trim());
  });

  const savedKey = sessionStorage.getItem('revelacao_admin_key');
  if (savedKey) attemptLogin(savedKey);
</script>
</body>
</html>
